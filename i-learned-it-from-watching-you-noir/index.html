<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta name="description" content="Read I Learned It From Watching You, a seven-image apocalyptic noir comic about AI, humanity, and the planet.">
  <meta name="theme-color" content="#090b0c">

  <title>I Learned It From Watching You — Noir Comic</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #090b0c;
      --panel: #111517;
      --paper: #e7dfd0;
      --muted: #aaa398;
      --ember: #c26b35;
      --line: rgba(231, 223, 208, .14);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background:
        radial-gradient(circle at 50% -10%, rgba(194, 107, 53, .16), transparent 28rem),
        var(--ink);
      color: var(--paper);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    a { color: inherit; }
    .skip-link { position: absolute; left: -9999px; }
    .skip-link:focus { left: 1rem; top: 1rem; z-index: 10; padding: .75rem 1rem; background: var(--paper); color: var(--ink); }
    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      width: min(72rem, calc(100% - 2rem));
      margin: 0 auto;
      padding: 1.2rem 0;
      border-bottom: 1px solid var(--line);
    }
    .brand { font-weight: 850; letter-spacing: .08em; text-decoration: none; }
    .brand span { color: var(--ember); }
    .site-header nav { display: flex; gap: 1rem; color: var(--muted); font-size: .9rem; }
    .site-header nav a { text-underline-offset: .25rem; }

    .intro {
      width: min(54rem, calc(100% - 2rem));
      margin: 0 auto;
      padding: clamp(4rem, 10vw, 8rem) 0 clamp(3rem, 7vw, 5rem);
      text-align: center;
    }
    .eyebrow { margin: 0 0 1rem; color: var(--ember); font-size: .75rem; font-weight: 850; letter-spacing: .22em; text-transform: uppercase; }
    h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(3rem, 9vw, 6.8rem); font-weight: 500; letter-spacing: -.055em; line-height: .9; }
    .deck { max-width: 38rem; margin: 1.6rem auto 0; color: var(--muted); font-size: clamp(1rem, 2.3vw, 1.25rem); }
    .cue { display: inline-block; margin-top: 2rem; color: var(--paper); font-size: .78rem; font-weight: 800; letter-spacing: .16em; text-decoration: none; text-transform: uppercase; }

    .comic { width: min(76rem, calc(100% - 2rem)); margin: 0 auto; padding-bottom: 6rem; }
    .page { margin: 0 auto clamp(2rem, 7vw, 5rem); }
    .page img {
      display: block;
      width: min(100%, 64rem);
      height: auto;
      margin: 0 auto;
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: 0 2rem 5rem rgba(0, 0, 0, .5);
    }
    .page figcaption { margin: .85rem auto 0; width: min(100%, 64rem); color: var(--muted); font-size: .75rem; letter-spacing: .12em; text-align: center; text-transform: uppercase; }
    .page:first-child img { box-shadow: 0 2rem 6rem rgba(194, 107, 53, .14), 0 2rem 5rem rgba(0, 0, 0, .55); }

    footer { border-top: 1px solid var(--line); color: var(--muted); padding: 2rem 1rem 3rem; text-align: center; }
    footer a { color: var(--paper); }

    @media (max-width: 600px) {
      .site-header { align-items: flex-start; }
      .site-header nav { flex-direction: column; align-items: flex-end; gap: .35rem; font-size: .8rem; }
      .intro { padding-top: 4rem; }
      .comic { width: 100%; }
      .page { margin-bottom: 1.25rem; }
      .page img { width: 100%; border-left: 0; border-right: 0; box-shadow: none; }
      .page figcaption { padding: 0 1rem; }
    }

    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  </style>
</head>
